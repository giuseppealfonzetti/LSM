<!-- ### Practice 1: R basics

::: {.panel-tabset}

##### Exercise 1

**Vectors and arithmetic**

Imagine you work for a small retail company. You have the prices and quantities sold for 5 products:


::: {.cell}

```{.r .cell-code}
prices     <- c(12.5, 8.0, 23.99, 5.50, 15.0)
quantities <- c(3, 10, 1, 25, 7)
```
:::


- Compute the total revenue across all products: use `sum(prices * quantities)`.
- How many products are there? Use `length(prices)`.
- What's the most expensive product? Use `max(prices)`.
- What's the cheapest? Use `min(prices)`.

- What is `prices[3]`? What is `prices[c(1, 4)]`?

- Use `seq()` to create a vector of discount percentages from 5% to 50% in steps of 5%.

##### Exercise 2

**Missing values and help**

You have monthly sales data, but two months are missing:


::: {.cell}

```{.r .cell-code}
monthly_sales <- c(120, 95, NA, 210, NA, 180)
```
:::


- Try `mean(monthly_sales)`. What happens?
- Use `?mean` to find the argument that ignores missing values. Compute the mean without `NA`s.
- How many values are missing? Use `is.na()` and `sum()`.
- Use `?max`. Compute the maximum sale ignoring `NA`s.

- Run `?seq`. What does the `length.out` argument do? Use it to create a vector of 7 evenly spaced values between 0 and 1.

##### Exercise 3

**Data frames**

Build a data frame from the vectors you created in Exercise 1:


::: {.cell}

```{.r .cell-code}
products <- data.frame(
  name     = c("Pen", "Notebook", "Backpack", "Eraser", "Marker"),
  price    = prices,
  quantity = quantities
)
```
:::


- Use `dim(products)`. How many rows and columns?
- Use `colnames(products)` and `str(products)` to inspect the data frame.
- Access the `price` column with `products$price`.
- Access the 3rd row with `products[3, ]`.
- What element is in row 2, column 3?
- Use `summary(products)`. What's the average price?
- Show only products with `quantity > 5`: use `products[products$quantity > 5, ]`.


##### Exercise 4

**Fix the code**

Each code snippet below contains a mistake. Copy it, run it, read the error message, then fix it.


::: {.cell}

```

```

### Practice 2: Visualisation with `txhousing`

The `txhousing` dataset is included in the `tidyverse`. Load it with:


::: {.cell}

```{.r .cell-code}
library(tidyverse)
```
:::


Then type `txhousing` to see it. It contains monthly housing sales data for 46 Texas cities (2000–2015).

::: {.panel-tabset}

##### Exercise 5

**Explore the data**

- Run `head(txhousing)` and `str(txhousing)`.
- How many observations are there? Use `dim()`.
- Run `summary(txhousing)`. What is the range of median house prices? Are there missing values?
- Compute the average median house price with `mean()`. Remember `na.rm`!

##### Exercise 6

**Your first scatterplot**

1. Build a scatterplot of `sales` (y-axis) vs `listings` (x-axis):


::: {.cell}

```{.r .cell-code}
ggplot(data = txhousing, aes(x = listings, y = sales)) +
  geom_point()
```
:::


2. Add labels with `labs()`:
    - x-axis: `"Active listings"`
    - y-axis: `"Number of sales"`
    - title: `"Texas housing market"`

3. Apply `theme_minimal()`.

4. Store the final plot in an object called `my_plot`.

##### Exercise 7

**Distributions**

1. Build a histogram of `median` (median house price):


::: {.cell}

```{.r .cell-code}
ggplot(data = txhousing, aes(x = median)) +
  geom_histogram()
```
:::


   Try `bins = 10`, `bins = 30`, and `bins = 100`. What happens with very few vs very many bins?

2. Build a bar chart showing how many records there are per `year`:


::: {.cell}

```{.r .cell-code}
ggplot(data = txhousing, aes(x = year)) +
  geom_bar()
```
:::


3. Add `labs()` to both plots.

##### Exercise 8

**Comparing across groups**

1. Build a boxplot of median house price by month:


::: {.cell}

```{.r .cell-code}
ggplot(data = txhousing, aes(x = factor(month), y = median)) +
  geom_boxplot()
```
:::


   Which month has the highest median prices? The most spread?

2. Build a boxplot of `sales` by `month`. Is there a seasonal pattern?

3. Use `?geom_boxplot`. Can you find an argument to change the fill color of the boxes? Try it!

4. Add `labs()` and `theme_minimal()`.

##### Exercise 9

**Bonus**

- Build a scatterplot of `volume` (y) vs `sales` (x), colored by `year`:


::: {.cell}

```{.r .cell-code}
ggplot(data = txhousing, aes(x = sales, y = volume, color = year)) +
  geom_point()
```
:::


- What trend do you see?
- Add `facet_wrap(~month)`. Does the pattern change across months?
- Add labels and a theme.

:::

          if (lineIds.length > 0) {
              //compute the position of the single el (top and bottom and make a div)
              const el = window.document.getElementById(lineIds[0]);
              top = el.offsetTop;
              height = el.offsetHeight;
              parent = el.parentElement.parentElement;
            if (lineIds.length > 1) {
              const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
              const bottom = lastEl.offsetTop + lastEl.offsetHeight;
              height = bottom - top;
            }
            if (top !== null && height !== null && parent !== null) {
              // cook up a div (if necessary) and position it 
              let div = window.document.getElementById("code-annotation-line-highlight");
              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
